# Stock Analyser — ASX market configuration
# Tickers are Yahoo symbols (.AX suffix); the app displays them without the suffix.

market:
  key: asx
  label: ASX
  currency: "A$"
  benchmark: "^AXJO"
  benchmark_label: "ASX 200"
  tape:
    "^AXJO": "ASX 200"
    "^AORD": "All Ordinaries"
    "^AXSO": "Small Ordinaries"
    "AUDUSD=X": "AUD/USD"
  session: { tz: "Australia/Sydney", open: "10:00", close: "16:00", label: "AEST/AEDT Sydney" }
  liquidity_floor: 1000000          # A$ 20-day avg dollar volume
  small_vs_large: ["^AXSO", "^AXJO"]   # small-cap risk appetite pair
  defensives: ["Consumer staples", "Healthcare"]
  cyclicals: ["Major banks", "Diversified miners", "Consumer discretionary"]

drivers:                             # Australia market drivers strip
  "AUDUSD=X":  { label: "AUD/USD",        themes: ["Exporters ↔ importers"] , beneficiaries: [] }
  "GC=F":      { label: "Gold (US$/oz)",  themes: ["Gold miners"], beneficiaries: [NST, EVN, GMD] }
  "HG=F":      { label: "Copper",         themes: ["Copper", "Diversified miners"], beneficiaries: [BHP, SFR] }
  "BZ=F":      { label: "Brent crude",    themes: ["Oil & gas"], beneficiaries: [WDS, STO, BPT] }
  "^TNX":      { label: "US 10Y yield",   themes: ["Banks ↔ REITs"], beneficiaries: [] }
  "SPY":       { label: "S&P 500",        themes: ["Global risk appetite"], beneficiaries: [] }
  "^HSI":      { label: "Hang Seng",      themes: ["China demand — iron ore, education, tourism"], beneficiaries: [BHP, RIO, FMG] }
  # Iron ore has no reliable free ticker; FMG/champion proxies stand in via the Iron ore theme itself.

baskets:
  Major banks:            [CBA.AX, NAB.AX, WBC.AX, ANZ.AX, MQG.AX, BEN.AX, BOQ.AX]
  Diversified miners:     [BHP.AX, RIO.AX, S32.AX, MIN.AX, IGO.AX]
